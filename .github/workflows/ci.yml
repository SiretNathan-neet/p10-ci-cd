# Workflow CI — tests + rapports de couverture + qualité du code (SonarQube Cloud)
# Déclenché sur chaque pull request vers main (validation obligatoire avant merge)
# et sur chaque push sur main.
name: CI - Tests, Coverage & Quality

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # Back-end : Spring Boot / Java 11 / Maven + JaCoCo
  # ---------------------------------------------------------------
  backend-tests:
    name: Back-end - Tests & couverture (JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet, requis par Sonar pour détecter le nouveau code

      - name: Installation de Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Lancement des tests (+ rapport JaCoCo)
        run: mvn -B clean verify dependency:copy-dependencies

      - name: Publication du rapport de couverture back
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: back/target/site/jacoco/
          if-no-files-found: warn

      - name: Analyse SonarQube Cloud (back)
        if: github.ref == 'refs/heads/main'  # plan gratuit : seule la branche principale est analysable
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: back
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------
  # Front-end : Angular 14 / Karma + Jasmine
  # ---------------------------------------------------------------
  frontend-tests:
    name: Front-end - Tests & couverture (Karma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet, requis par Sonar pour détecter le nouveau code

      - name: Installation de Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Lancement des tests (+ rapport de couverture)
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Publication du rapport de couverture front
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: front/coverage/bobapp/
          if-no-files-found: warn

      - name: Installation de Node.js 20 (requis par l'analyseur Sonar)
        if: github.ref == 'refs/heads/main'  # plan gratuit : seule la branche principale est analysable
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Analyse SonarQube Cloud (front)
        if: github.ref == 'refs/heads/main'  # plan gratuit : seule la branche principale est analysable
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: front
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
