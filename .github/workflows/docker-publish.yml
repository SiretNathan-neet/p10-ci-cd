# Workflow CD — build des images Docker et publication sur Docker Hub
# - Sur pull request : build des deux images (sans push) pour valider les Dockerfile
# - Sur main : build + push, uniquement si le workflow CI (tests, couverture, Sonar) a réussi
name: Docker - Build & Publish

on:
  workflow_run:
    workflows: [ "CI - Tests, Coverage & Quality" ]
    types: [ completed ]
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKERHUB_USERNAME: siretnathan

jobs:
  docker:
    name: Docker - ${{ matrix.service }}
    # Sur main : on ne continue que si la CI a réussi
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [ back, front ]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          # Sur workflow_run : on build exactement le commit validé par la CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion à Docker Hub
        if: github.event_name == 'workflow_run'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Génération des tags et labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/app-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }},enable=${{ github.event_name == 'workflow_run' }}
            type=ref,event=pr

      - name: Build (et push sur main) de l'image ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'workflow_run' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
