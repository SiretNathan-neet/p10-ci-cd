# --- Identification SonarQube Cloud ---
sonar.organization=siretnathan-neet
sonar.projectKey=SiretNathan-neet_app-back
sonar.projectName=App - Back-end

# --- Perimetre analyse ---
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8
sonar.java.source=11

# --- Bytecode compile par Maven (obligatoire pour l'analyse Java) ---
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar
sonar.java.test.libraries=target/dependency/*.jar

# --- Couverture : rapport XML genere par JaCoCo ---
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Le job echoue si la Quality Gate echoue ---
sonar.qualitygate.wait=true
